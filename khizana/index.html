<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="خزانتي">
<meta name="theme-color" content="#1E3A5F">
<meta name="robots" content="noindex">
<title>خزانة قدوم خالد</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* خزانة: ختم في الرأس، بحث، بطاقات لكل درج، وأدراج في الأسفل */
:root{
  /* ألوان التطبيقات الثلاثة الموحّدة (المدرسة وخزانتي والمورد) */
  --bg:#F5F7FA; --paper:#FFFFFF; --ink:#0F1E33; --muted:#64748B; --line:#DCE3EA;
  --gold:#2F6FD6; --gold-soft:#E8F0FD; --ink-btn:#1E3A5F; --on-btn:#FFFFFF; --danger:#B42318;
  --ok:#2f6b4a; --ok-soft:#e2efe7; --warn:#8a5a12; --warn-soft:#f6ead4; --plan:#455a75; --plan-soft:#e4e9f1;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;
  --f-title:"Amiri","Noto Naskh Arabic",serif;
  --f-body:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --paper:#111A2B; --ink:#E6ECF5; --muted:#93A3B8; --line:#24324A;
  --gold:#8AB6FF; --gold-soft:#1A2A45; --ink-btn:#9DBEF0; --on-btn:#0B1220; --danger:#F08A80;
  --ok:#7cc59b; --ok-soft:#1b2d24; --warn:#e2b36a; --warn-soft:#2f2617; --plan:#9fb4d1; --plan-soft:#1e2938; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --paper:#111A2B; --ink:#E6ECF5; --muted:#93A3B8; --line:#24324A;
  --gold:#8AB6FF; --gold-soft:#1A2A45; --ink-btn:#9DBEF0; --on-btn:#0B1220; --danger:#F08A80;
  --ok:#7cc59b; --ok-soft:#1b2d24; --warn:#e2b36a; --warn-soft:#2f2617; --plan:#9fb4d1; --plan-soft:#1e2938; color-scheme:dark}
:root[data-font="amiri"]{--f-body:"Amiri","Noto Naskh Arabic",serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs,16px);line-height:1.7;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px}
header.top{display:flex;align-items:center;gap:14px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.seal{width:62px;height:62px;flex:none}
.who{min-width:0;flex:1}
.gear{flex:none;align-self:flex-start;width:42px;height:42px;border:1px solid var(--line);background:var(--paper);border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.gear svg{width:22px;height:22px}
.gear[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.who h1{font-family:var(--f-title);font-size:1.7rem;line-height:1.2;margin:0;font-weight:700}
.who p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.status{font-size:.78rem;color:var(--muted);margin-top:2px}
.status.warn{color:var(--warn)} .status.ok{color:var(--ok)}
.search{width:100%;margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
h2.sec{font-family:var(--f-display);font-size:1.5rem;margin:22px 0 4px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:400}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.appb{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 6px;display:grid;gap:2px;text-align:center;cursor:pointer;color:var(--ink);font:inherit}
.appb b{font-size:.95rem;color:var(--ink-btn)}
.appb span{font-size:.8rem;color:var(--muted)}
.appb.here{background:var(--gold-soft);cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink-btn);color:var(--on-btn);border-color:var(--ink-btn)}
.list{display:grid;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.card .head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card.kun .ktext{font-family:"Amiri",serif;font-size:1.3rem;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.card.kun .bayt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:baseline;font-family:"Amiri",serif;font-size:1.22rem;line-height:2;color:var(--ink)}
.card.kun .bayt .sadr{text-align:right}.card.kun .bayt .ajuz{text-align:left}.card.kun .bsep{color:var(--gold,#a8812f);font-size:.85rem}
@media (max-width:460px){.card.kun .bayt{grid-template-columns:1fr;gap:0}.card.kun .bsep{display:none}.card.kun .bayt .ajuz{padding-right:22px}}
.card.kun .ksrc{font-family:"Amiri",serif;color:var(--muted);font-size:1rem}
.kfav{border:0;background:none;font-size:1.35rem;line-height:1;color:var(--muted);cursor:pointer;padding:2px 4px}
.kfav[aria-pressed="true"]{color:#b8892c}
.card h3{margin:0;font-family:var(--f-title);font-size:1.2rem;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.notes{font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.pill{flex:none;font-size:.76rem;padding:1px 10px;border-radius:999px;background:var(--plan-soft);color:var(--plan);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.rev{background:#e3eefb;color:#1f5f9e} .pill.stop{background:#f8e3e1;color:#9b2c22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.rev{background:#16263a;color:#8cbcf0} :root:not([data-theme="light"]) .pill.stop{background:#33191a;color:#f0a39b}}
:root[data-theme="dark"] .pill.rev{background:#16263a;color:#8cbcf0} :root[data-theme="dark"] .pill.stop{background:#33191a;color:#f0a39b}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 12px;font-size:.9rem;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.fab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--ink-btn);color:var(--on-btn);border-color:var(--ink-btn)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.box{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:14px;display:grid;gap:8px;margin-bottom:12px}
.box p{margin:0}
.drop{display:grid;gap:2px;text-align:center;border:2px dashed var(--gold);background:var(--gold-soft);border-radius:12px;padding:18px;cursor:pointer;margin-bottom:12px}
.drop span{font-size:.85rem;color:var(--muted)}
.thumb{max-width:100%;max-height:200px;border-radius:8px;object-fit:contain;justify-self:start}
.prof{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.prof dl{margin:0}
.prof .row{display:grid;grid-template-columns:8.5em 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prof .row:last-child{border-bottom:0}
.prof dt{color:var(--muted);font-size:.9rem}
.prof dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:8px;margin:14px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.panel p{margin:0}
nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tab{flex:1;min-width:0;max-width:140px;border:0;background:none;padding:8px 1px 9px;cursor:pointer;font-size:.76rem;color:var(--muted);display:grid;justify-items:center;gap:1px;border-top:2px solid transparent}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--gold);border-top-color:var(--gold);font-weight:600}
.fab{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink-btn);color:var(--on-btn);border:0;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgb(0 0 0 / .22);z-index:6}
.overlay{position:fixed;inset:0;background:rgb(10 16 24 / .5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--f-display);font-size:1.4rem;margin:0 0 10px;overflow-wrap:anywhere}
.field{display:grid;gap:3px;margin-bottom:10px}
.field label{font-size:.88rem;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.field textarea{min-height:90px;resize:vertical}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.foot .spacer{flex:1}
.viewer img,.viewer video{max-width:100%;max-height:60vh;display:block;margin:0 auto 10px;border-radius:8px}
.viewer iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff}
.viewer audio{width:100%;margin-bottom:10px}
.dd-sum{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.dd-sum b{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:6px 10px;font-weight:normal;font-size:.9rem}
.dd-g{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.dd-g[data-off="1"]{opacity:.55}
.dd-g header{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.dd-g header input{width:20px;height:20px;accent-color:var(--ink-btn)}
.dd-m{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;background:var(--paper);cursor:pointer}
.dd-m input{margin-top:5px;accent-color:var(--gold)}
.dd-m div{min-width:0;overflow-wrap:anywhere}
.dd-m small{display:block;color:var(--muted);direction:ltr;text-align:right}
.dd-m em{font-style:normal;font-size:.75rem;color:var(--gold)}
.dd-m:not(:has(input:checked)) em{color:var(--danger)}
.dd-bar{position:sticky;bottom:-18px;background:var(--paper);padding:10px 0 4px;margin-top:10px;display:grid;gap:6px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:999px;font-size:.88rem;z-index:30;max-width:90%;text-align:center}
.sgroup{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:2px 16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .lbl{min-width:0}
.srow .lbl b{display:block;font-weight:600}
.srow .lbl span{display:block;color:var(--muted);font-size:.84rem;line-height:1.5}
.srow select{flex:none;max-width:48%;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.sw{flex:none;position:relative;width:50px;height:30px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .15s}
.sw input:checked+i{background:var(--gold)}
.sw input:checked+i::after{transform:translateX(-20px)}
.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.sw input:disabled+i{opacity:.45}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.lock .seal{width:96px;height:96px}
.lock h2{font-family:var(--f-title);font-size:1.6rem;margin:0}
.lock .msg{color:var(--muted);font-size:.92rem;min-height:1.6em;text-align:center}
.lock .msg.bad{color:var(--danger)}
.dots{display:flex;gap:14px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:1.6px solid var(--gold)}
.dots i.on{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr;margin-top:6px}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.6rem;font-family:var(--f-body);cursor:pointer;color:var(--ink);display:grid;place-items:center}
.pad button:active{background:var(--gold-soft)}
.pad button.ghost{border:0;background:none;font-size:.95rem;color:var(--muted)}
.pad svg{width:30px;height:30px}
.lock .link{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem}
body.locked .wrap,body.locked nav.tabs,body.locked .fab{visibility:hidden}
@media (max-width:460px){.stats{gap:5px}.stat span{font-size:.72rem}.prof .row{grid-template-columns:1fr;gap:0}}
/* «أعمالي» مجلدات: شاشة أعمالك الرئيسية على الآيفون والآيباد والماك */
.vbar{display:flex;gap:6px;margin:6px 0 10px}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fold{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:14px 10px 12px;display:grid;justify-items:center;gap:6px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s,border-color .12s}
.fold:hover{border-color:var(--gold);transform:translateY(-2px)}
.fold:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fold svg{width:64px;height:52px}
.fold b{font-family:var(--f-title);font-size:1rem;line-height:1.45;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fold small{color:var(--muted);font-size:.8rem}
.frow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .fn{flex:1;min-width:0;overflow-wrap:anywhere}
@media (min-width:820px){.wrap{max-width:1180px}.folders{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}.fold svg{width:78px;height:64px}main .list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
@media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px)}}}
</style>

  const m=(a&&a.text||'').match(/(?:تأليف|لمؤلفه|للإمام|للشيخ|للعلامة|بقلم|إعداد)\s*[:：]?\s*([^\n]{3,60})/);return m?cleanLine(m[1]):'';
}
async function classify(f,a){
  const n=f.name||'',e=extOf(n),t=f.type||'';a=a||{};
  if(e==='vcf'||/vcard/.test(t))return{to:'contact'};
  if(e==='json'&&f.size<50*1048576){try{const o=JSON.parse(await f.text());if(o&&o.app==='khizana')return{to:'backup'}}catch(_){}}
  if((e==='txt'||e==='md'||t==='text/plain')&&f.size<300000)return{to:'note'};
  if(/^audio\//.test(t)||['mp3','m4a','aac','wav','ogg','opus','amr','caf'].includes(e))return{cat:'صوتيات'};
  if(/^video\//.test(t)||['mp4','mov','m4v','3gp','avi','mkv'].includes(e))return{cat:'فيديو'};
  if(['xls','xlsx','csv','numbers','ods'].includes(e))return{cat:'جداول'};
  const isImg=/^image\//.test(t)||['jpg','jpeg','png','heic','heif','gif','webp','tif','tiff'].includes(e);
  const isPdf=e==='pdf'||/pdf/.test(t);
  if(EBOOK.includes(e))return{cat:'كتب PDF',book:true,pages:a.pages||0,title:guessTitle(a,n),author:guessAuthor(a),subject:subjectOf(a.text||'',n+' '+(a.title||'')+' '+(a.author||''))};
  const pages=a.pages||(isPdf?await pdfPages(f):0);
  const txt=n+'\n'+(a.title||'')+'\n'+(a.author||'')+'\n'+(a.text||'');
  const sc={official:score('official',txt),research:score('research',txt),book:score('book',txt)};
  if(isPdf){if(pages>=60)sc.book+=8;else if(pages>=25)sc.book+=4,sc.research+=3;else if(pages<=4)sc.official+=2;if(a.author)sc.book+=2}
  if(isImg){const words=(a.text||'').split(/\s+/).filter(Boolean).length;
    if(words<12&&sc.official<6)return{cat:/^(IMG|DSC|PXL|photo|صورة)/i.test(n)||!a.ocr?'صور':'صور'};
    sc.official+=words>25?2:0;}
  const best=Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0],top=sc[best];
  /* ملف PDF كبير (40 صفحة فأكثر، أو حجم كبير لم تُعرف صفحاته) كتابٌ ما لم يكن وثيقة رسمية أو مذكرة جامعية صريحة */
  const thesis=/مذكر[ةه] (تخرج|لنيل|مقدم)|رسال[ةه] (ماجستير|دكتوراه)|أطروح|اطروح|th[èe]se|m[ée]moire/i.test(txt);
  if(isPdf&&(pages>=40||(!pages&&f.size>3*1048576))&&best!=='official'&&!(best==='research'&&thesis))
    return{cat:'كتب PDF',book:true,pages,title:guessTitle(a,n),author:guessAuthor(a),subject:subjectOf(txt,n+' '+(a.title||'')+' '+(a.author||''))};
  if(top<4){if(isImg)return{cat:'صور',pages};return{cat:'مستندات',pages}}
  if(best==='official')return{cat:'وثائق رسمية',pages,title:guessTitle(a,n)};
  if(best==='research')return{cat:'أبحاث',pages,title:guessTitle(a,n),work:pages>=15,author:guessAuthor(a)};
  if(isImg)return{cat:'مستندات',pages};
  return{cat:'كتب PDF',book:true,pages,title:guessTitle(a,n),author:guessAuthor(a),subject:subjectOf(txt,n+' '+(a.title||'')+' '+(a.author||''))};
}

const EBOOK=['epub','mobi','azw','azw3','djvu','fb2'];
/* ملف في «ملفاتي» يصلح أن يكون كتابًا ولم يُسجَّل في «كتبي» */
function bookOf(fid){return live().find(b=>b.kind==='book'&&b.fileId===fid)}
function canBeBook(it){const e=extOf(it.fname||it.title);return it.kind==='file'&&!it.del&&(e==='pdf'||/pdf/.test(it.type||'')||EBOOK.includes(e))&&!bookOf(it._id)}
async function fileToBook(it,quiet){
  const t=baseName(it.title&&it.title!==it.fname?it.title:(it.fname||it.title));
  const au=((it.notes||'').match(/المؤلف: ([^\n]+)/)||[])[1]||'';
  await save({_id:uid(),kind:'book',title:t,author:au,cat:subjectOf(it.notes||'',t+' '+au),status:'أملكه',place:'نسخة PDF في «ملفاتي»'+(it.pages?' · '+it.pages+' صفحة':''),fileId:it._id});
  if(it.cat!=='كتب PDF')await save(Object.assign({},it,{cat:'كتب PDF'}));
  if(!quiet){render();toast('أُضيف «'+t+'» إلى «كتبي»')}
}
/* مرة واحدة: الكتب التي وصلت قبل تحسين التصنيف فبقيت في «ملفاتي» تُنقل إلى «كتبي» */
async function rescueBooks(){
  if(items.get('_books2'))return;
  let n=0;
  for(const it of live())if(canBeBook(it)&&(EBOOK.includes(extOf(it.fname||''))||(['مستندات','كتب PDF'].includes(it.cat)&&(it.pages>=40||(!it.pages&&it.size>3*1048576)))||(it.cat==='أبحاث'&&it.pages>=80))){await fileToBook(it,true);n++}
  await save({_id:'_books2',kind:'meta'});
  if(n){render();toast('نُقل '+n+(n===1?' كتاب':' كتب')+' من «ملفاتي» إلى «كتبي»')}
}

/* الترتيب الذكي لـ«أعمالي»: كل ملف في «ملفاتي» يُفحص مرة واحدة،
   فإن طابق عملًا رُبط به (وإن كان قد ذهب إلى «كتبي» خطأً أُخرج منها)،
   وإن كان بحثًا أو مذكرة أو نسخة من عمل صار عملًا جديدًا في «أعمالي». */
let sorting=false;
async function sortWorks(quiet){
  if(sorting)return 0;sorting=true;let linked=0,made=0;
  try{
    for(const f of live()){
      if(f.kind!=='file'||f.sorted)continue;
      const nm=f.fname||f.title,w=workOf(nm)||(f.title&&f.title!==nm?workOf(f.title):null);
      const inWork=live().some(x=>x.kind==='work'&&(x.files||[]).includes(f._id));
      if(!inWork){
        if(w){await save({...items.get(w._id),files:[...new Set([...(items.get(w._id).files||[]),f._id])]});linked++;await save({...items.get(f._id),cat:'من أعمالي'});
          const b=bookOf(f._id);if(b)await save({_id:b._id,kind:'book',del:true})}
        else if(!bookOf(f._id)&&(f.cat==='أبحاث'||WORK_RE.test(baseName(nm)))){
          const au=((f.notes||'').match(/المؤلف: ([^\n]+)/)||[])[1]||'';
          await save({_id:uid(),kind:'work',title:baseName(f.title&&f.title!==f.fname?f.title:nm),type:/مذكر/.test(nm)?'مذكرة':'بحث',status:'منجز',notes:au?'المؤلف: '+au:'',files:[f._id]});made++;await save({...items.get(f._id),cat:'من أعمالي'})}
      }
      await save({...items.get(f._id),sorted:true});
    }
  }finally{sorting=false}
  if((linked||made)&&!quiet){render();toast('رُتّبت أعمالك: '+[linked?linked+' ملف رُبط بعمله':'',made?made+' عمل جديد في «أعمالي»':''].filter(Boolean).join('، '))}
  return linked+made;
}

/* ====== الترتيب الشامل وتصفية المكرر ======
   يمرّ على كل ما في الخزانة: ينظّف العناوين، ويحذف المكرر (ملفات وكتب وأعمال ومذكرات وجهات)
   مع نقل روابطه إلى النسخة الباقية، ويضع كل كتاب في موضوعه وكل ملف في نوعه.
   لا يغيّر موضوعًا أو تصنيفًا اخترته بيدك إلا ما كان «أخرى» أو بلا تصنيف. */
function dupKey(n){return normAr(String(n||'').replace(/\.[a-z0-9]{2,5}$/i,'').replace(/\s*[\(\[]\d{1,3}[\)\]]\s*$/,'').replace(/[-_ ]*(copy|نسخ[ةه])\s*\d*$/i,''))}
function cleanTitle(t){const o=String(t||'');let c=o.replace(/\.(pdf|docx?|epub|mobi|azw3?|djvu|pages|txt|rtf|jpe?g|png|heic)$/i,'').replace(/_/g,' ').replace(/\s*[\(\[]\d{1,3}[\)\]]\s*$/,'').replace(/\s+/g,' ').trim();return c.length>=2?c:o}
function phoneKey(p){const d=String(p||'').replace(/\D/g,'');return d.length>=8?d.slice(-9):''}
const OLD_CATS={'القراءات':'القراءات والتجويد','التفسير':'التفسير وعلوم القرآن'};
function quickFileCat(it){
  const n=it.fname||it.title||'',e=extOf(n),t=it.type||'';
  if(/^audio\//.test(t)||['mp3','m4a','aac','wav','ogg','opus','amr','caf'].includes(e))return'صوتيات';
  if(/^video\//.test(t)||['mp4','mov','m4v','3gp','avi','mkv'].includes(e))return'فيديو';
  if(['xls','xlsx','csv','numbers','ods'].includes(e))return'جداول';
  const txt=n+'\n'+(it.title||'')+'\n'+(it.notes||'');
  const o=score('official',txt),r=score('research',txt);
  if(o>=4&&o>=r)return'وثائق رسمية';if(r>=5)return'أبحاث';
  if(/^image\//.test(t)||['jpg','jpeg','png','heic','heif','gif','webp'].includes(e))return'صور';
  return'';
}
let tidying=false;
async function tidyAll(show){
  if(tidying)return;tidying=true;
  const R={titles:0,dupFiles:0,dupBooks:0,dupWorks:0,dupNotes:0,dupContacts:0,subjects:0,fileCats:0};
  const kill=async id=>{const it=items.get(id);if(!it||it.del)return;if(it.kind==='file'){try{await IDB.delBlob(id)}catch(_){}SYNC.delBlob(it)}await save({_id:id,kind:it.kind,del:true})};
  const richer=(a,b)=>Object.values(a).filter(v=>v&&String(v).length).length>=Object.values(b).filter(v=>v&&String(v).length).length?[a,b]:[b,a];
  try{
    await sortWorks(true);
    /* ١. الملفات المكررة: الاسم نفسه والحجم نفسه */
    const fg=new Map();
    for(const f of live())if(f.kind==='file'&&f.size){const k=dupKey(f.fname||f.title)+'|'+f.size;(fg.get(k)||fg.set(k,[]).get(k)).push(f)}
    for(const g of fg.values()){if(g.length<2)continue;
      const linked=x=>live().some(w=>w.kind==='work'&&(w.files||[]).includes(x._id))||bookOf(x._id);
      g.sort((a,b)=>(linked(b)?1:0)-(linked(a)?1:0)||(a.at||0)-(b.at||0));
      const keep=g[0];
      for(const d of g.slice(1)){
        for(const w of live())if(w.kind==='work'&&(w.files||[]).includes(d._id))await save({...w,files:[...new Set(w.files.map(x=>x===d._id?keep._id:x))]});
        const b=bookOf(d._id);if(b){if(bookOf(keep._id))await kill(b._id);else await save({...b,fileId:keep._id})}
        await kill(d._id);R.dupFiles++}}
    /* ٢. الكتب المكررة: العنوان نفسه (والمؤلف إن وُجد) */
    const bg=new Map();
    for(const b of live())if(b.kind==='book'){const k=dupKey(b.title)+'|'+(b.author?normAr(b.author).split(' ').slice(0,2).join(' '):'');(bg.get(k)||bg.set(k,[]).get(k)).push(b)}
    for(const g of bg.values()){if(g.length<2)continue;let keep=g.find(b=>b.fileId&&items.get(b.fileId)&&!items.get(b.fileId).del)||g[0];
      for(const d of g){if(d===keep)continue;const m={...d,...keep};
        for(const f of ['author','place','link','notes','cat'])if(!m[f]||m[f]==='أخرى')m[f]=d[f]||m[f];
        await save(m);keep=items.get(keep._id);await kill(d._id);R.dupBooks++}}
    /* ٣. الأعمال المكررة: تُجمع ملفاتها في عمل واحد */
    const wg=new Map();
    for(const w of live())if(w.kind==='work'){const k=dupKey(w.title);(wg.get(k)||wg.set(k,[]).get(k)).push(w)}
    for(const g of wg.values()){if(g.length<2)continue;g.sort((a,b)=>(b.files||[]).length-(a.files||[]).length||(MY_WORKS.some(m=>m[0]===b.title)?1:0)-(MY_WORKS.some(m=>m[0]===a.title)?1:0));
      const keep=g[0];let files=[...(keep.files||[])],notes=keep.notes||'';
      for(const d of g.slice(1)){files.push(...(d.files||[]));if(d.notes&&!notes.includes(d.notes))notes=[notes,d.notes].filter(Boolean).join('\n');await kill(d._id);R.dupWorks++}
      await save({...items.get(keep._id),files:[...new Set(files)],notes})}
    /* ٤. المذكرات المكررة */
    const ng=new Set();
    for(const n of live().filter(x=>x.kind==='note').sort((a,b)=>(a.at||0)-(b.at||0))){const k=normAr(n.title)+'|'+normAr(n.body).slice(0,400);if(ng.has(k)){await kill(n._id);R.dupNotes++}else ng.add(k)}
    /* ٥. جهات الاتصال المكررة داخل خزانتي (الرقم نفسه) تُدمج في بطاقة واحدة */
    const cg=new Map();
    for(const c of live())if(c.kind==='contact'){const k=phoneKey(c.phone)||phoneKey(c.whatsapp)||('n:'+normAr(c.title));if(k==='n:')continue;(cg.get(k)||cg.set(k,[]).get(k)).push(c)}
    for(const g of cg.values()){if(g.length<2)continue;let m={...g[0]};
      for(const d of g.slice(1)){for(const f of ['role','group','phone','whatsapp','email','address'])if(!m[f])m[f]=d[f];
        if(d.notes&&!(m.notes||'').includes(d.notes))m.notes=[m.notes,d.notes].filter(Boolean).join('\n');
        if((d.title||'').length>(m.title||'').length)m.title=d.title;await kill(d._id);R.dupContacts++}
      await save(m)}
    /* ٦. العناوين: بلا امتداد ولا «_» ولا «(1)» */
    for(const it of live()){if(!['file','book','work'].includes(it.kind))continue;const c=cleanTitle(it.title);if(c!==it.title){await save({...it,title:c});R.titles++}}
    /* ٧. كل كتاب في موضوعه */
    for(const b of live()){if(b.kind!=='book')continue;let cat=OLD_CATS[b.cat]||b.cat;
      if(!cat||cat==='أخرى'||!BOOK_CATS.includes(cat)){const f=b.fileId&&items.get(b.fileId);const c=subjectOf((b.notes||'')+' '+(f&&f.notes||''),b.title+' '+(b.author||'')+' '+(f&&f.fname||''));if(c!=='أخرى'||!cat||!BOOK_CATS.includes(cat))cat=c}
      if(cat!==b.cat){await save({...b,cat});R.subjects++}}
    /* ٨. كل ملف في نوعه */
    for(const f of live()){if(f.kind!=='file')continue;let cat=f.cat;
      if(live().some(w=>w.kind==='work'&&(w.files||[]).includes(f._id)))cat='من أعمالي';
      else if(bookOf(f._id))cat='كتب PDF';
      else if(!cat||cat==='أخرى'||cat==='مستندات'||!FILE_CATS.includes(cat)||cat==='من أعمالي')cat=quickFileCat(f)||(cat==='من أعمالي'||!FILE_CATS.includes(cat||'')?'مستندات':cat||'مستندات');
      if(cat!==f.cat){await save({...f,cat});R.fileCats++}}
  }finally{tidying=false}
  await save({_id:'_tidy1',kind:'meta'});
  const total=Object.values(R).reduce((a,b)=>a+b,0);
  render();
  if(show||total)tidySheet(R,total);
  return R;
}
function tidySheet(R,total){
  const L=[[R.dupFiles,'ملف مكرر حُذف (وبقيت نسخة واحدة بروابطها)'],[R.dupBooks,'كتاب مكرر دُمج في «كتبي»'],[R.dupWorks,'عمل مكرر جُمعت ملفاته في «أعمالي»'],[R.dupNotes,'مذكرة مكررة حُذفت'],[R.dupContacts,'جهة اتصال مكررة دُمجت في «جهاتي»'],
    [R.subjects,'كتاب وُضع في موضوعه'],[R.fileCats,'ملف وُضع في نوعه في «ملفاتي»'],[R.titles,'عنوان نُظّف من الامتداد والزوائد']].filter(x=>x[0]);
  sheet(`<h3>ترتيب الخزانة</h3><div class="box">${total?`<p>رُتّبت خزانتك:</p><ul style="margin:6px 0 0;padding-inline-start:20px;line-height:1.9">${L.map(([n,t])=>`<li><b>${n}</b> ${t}</li>`).join('')}</ul>`:'<p>فحصتُ كل ما في خزانتك، وكل شيء في مكانه ولا مكرر فيه.</p>'}</div>
   <p class="meta">الكتب في «كتبي» صارت مقسّمة حسب الموضوع، والملفات في «ملفاتي» حسب النوع. ما اخترته بيدك من قبل بقي كما هو.</p><div class="actions"><button class="btn primary" data-act="close">تم</button></div>`);
}

/* ---------- التخزين في الجهاز (IndexedDB) ---------- */
const IDB={
  db:null,
  open(){return this.db||(this.db=new Promise((ok,no)=>{const r=indexedDB.open('khizana',1);r.onupgradeneeded=()=>{r.result.createObjectStore('recs',{keyPath:'_id'});r.result.createObjectStore('blobs')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},
  async tx(store,mode,fn){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction(store,mode);const st=t.objectStore(store);let res;const q=fn(st);if(q)q.onsuccess=()=>res=q.result;t.oncomplete=()=>ok(res);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})},
  all(){return this.tx('recs','readonly',s=>s.getAll())},
  putRec(r){return this.tx('recs','readwrite',s=>s.put(r))},
  getBlob(id){return this.tx('blobs','readonly',s=>s.get(id))},
  putBlob(id,b){return this.tx('blobs','readwrite',s=>s.put(b,id))},
  delBlob(id){return this.tx('blobs','readwrite',s=>s.delete(id))}
};

async function save(rec,fromRemote){
  if(!fromRemote)rec.at=Date.now();
  items.set(rec._id,rec);

async function del(id){

/* ---------- المزامنة بين الأجهزة (Firebase، حساب تطبيق المدرسة نفسه) ---------- */
const SYNC={
  auth:null,db:null,user:null,unsub:null,remoteAt:{},started:false,err:'',
  async libs(){
    const add=n=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}-compat.js`;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    if(!window.firebase)await add('app');if(!firebase.auth)await add('auth');if(!firebase.firestore)await add('firestore');
  },
  async start(){
    if(this.started)return;this.started=true;
    try{await this.libs()}catch(_){this.started=false;this.err='لا يوجد اتصال بالإنترنت، ستبدأ المزامنة عند عودته.';status();return}
    if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
    this.auth=firebase.auth();this.db=firebase.firestore();
    this.auth.onAuthStateChanged(u=>this.onUser(u));
  },
  col(n){return this.db.collection('users').doc(this.user.uid).collection(n)},
  onUser(u){
    if(this.unsub){this.unsub();this.unsub=null}
    this.user=u;this.remoteAt={};status();render();
    if(!u)return;
    let first=true;
    this.unsub=this.col('khizana').onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{
        if(ch.type==='removed')return;
        const r=Object.assign({_id:ch.doc.id},ch.doc.data());this.remoteAt[r._id]=r.at||0;
        const l=items.get(r._id);
        if(!l||(r.at||0)>(l.at||0)){save(r,true);if(r.del&&r.kind==='file')IDB.delBlob(r._id).catch(()=>{})}
      });
      if(first){first=false;this.pushAll();migrateStatus().then(addKunnash).catch(()=>{});setTimeout(()=>sortWorks().catch(()=>{}),1500)}
      this.err='';status();render();
    },e=>{this.err='تعذّر الاتصال بالحساب: '+(e.code||e.message||'');status()});
  },
  clean(r){const o={};for(const k in r)if(k!=='_id'&&r[k]!==undefined)o[k]=r[k];return o},
  async push(r){
    if(!this.user)return;
    try{await this.col('khizana').doc(r._id).set(this.clean(r));this.remoteAt[r._id]=r.at}catch(e){this.err='لم تُرفع بعض التعديلات، ستُرفع لاحقًا';status()}
    if(r.kind==='file'&&!r.del&&!r.up&&r.size<=SYNC_MAX)this.upBlob(r);
  },
  async pushAll(){
    for(const r of items.values()){
      if((r.at||0)>(this.remoteAt[r._id]||0))await this.push(r);
      else if(r.kind==='file'&&!r.del&&!r.up&&r.size<=SYNC_MAX)this.upBlob(r);
    }
  },
  uploading:new Set(),
  async upBlob(r){
    if(!this.user||this.uploading.has(r._id))return;
    const b=await IDB.getBlob(r._id).catch(()=>null);if(!b)return;
    this.uploading.add(r._id);
    try{
      const u=new Uint8Array(await b.arrayBuffer());const n=Math.max(1,Math.ceil(u.length/CHUNK));
      for(let i=0;i<n;i++)await this.col('khizana_blobs').doc(r._id+'_'+i).set({i,n,b:firebase.firestore.Blob.fromUint8Array(u.subarray(i*CHUNK,(i+1)*CHUNK))});
      const cur=items.get(r._id);if(cur&&!cur.del){cur.up=true;cur.parts=n;await save(cur)}
    }catch(e){toast('لم يُرفع «'+r.title+'» إلى الحساب بعد')}
    this.uploading.delete(r._id);
  },
  async downBlob(r){
    if(!this.user||!r.up)return null;
    const parts=[];for(let i=0;i<(r.parts||1);i++){const d=await this.col('khizana_blobs').doc(r._id+'_'+i).get();if(!d.exists)return null;parts.push(d.data().b.toUint8Array())}
    const b=new Blob(parts,{type:r.type||''});await IDB.putBlob(r._id,b);return b;
  },
  async delBlob(r){if(!this.user||!r.up)return;try{for(let i=0;i<(r.parts||1);i++)await this.col('khizana_blobs').doc(r._id+'_'+i).delete()}catch(_){}}
};

const NEEDS_READ=['pdf','jpg','jpeg','png','heic','heif','tif','tiff','webp'];
async function analyzeNative(f){
  if(!NATIVE||f.size>40*1048576||!NEEDS_READ.includes(extOf(f.name)))return null;
  try{const tmp='a'+uid();const step=393216;
    for(let i=0,o=0;o<f.size||i===0;i++,o+=step){if(!await nat({action:'chunk',id:tmp,i,s:await b64(f.slice(o,o+step))}))return null}
    return await nat({action:'analyze',id:tmp,src:'part',name:f.name})}catch(_){return null}
}
async function addFiles(list,analyses){
  const tally={};const bump=(k,tb)=>{tally[k]=tally[k]||{n:0,tab:tb};tally[k].n++};
  if(list.length>1||NATIVE)toast('جارٍ قراءة '+(list.length>1?list.length+' ملفات':'الملف')+' وتصنيفه…');
  for(let i=0;i<list.length;i++){
    const f=list[i];
    const a=S.smart?((analyses&&analyses[i])||await analyzeNative(f)):null;
    const c=await classify(f,a);
    if(c.book&&!S.autoBook)c.book=false;
    if(c.to==='contact'){const n=await importVcf([f],true);if(n)bump(n===1?'جهة اتصال في «جهاتي»':'جهات اتصال في «جهاتي»','contact');else toast('وصلت بطاقة لكن لم أجد فيها اسمًا ولا هاتفًا');continue}
    if(c.to==='backup'){await doImport(f);bump('نسخة احتياطية استُعيدت','profile');continue}
    if(c.to==='note'){await save({_id:uid(),kind:'note',tag:'فائدة علمية',title:baseName(f.name),body:await f.text()});bump('مذكرات','note');continue}
    const twin=live().find(x=>x.kind==='file'&&x.size===f.size&&dupKey(x.fname||x.title)===dupKey(f.name));
    if(twin){bump('ملف موجود من قبل فلم يُكرَّر','file');continue}
    const w=workOf(f.name)||(c.title?workOf(c.title):null);
    if(w){c.book=false;c.cat='من أعمالي'}
    const id=uid();
    try{await IDB.putBlob(id,f)}catch(e){toast('لا توجد مساحة كافية لـ«'+f.name+'»');continue}
    const title=c.title&&c.title!==baseName(f.name)?c.title:f.name;
    const notes=[c.author?'المؤلف: '+c.author:'',c.pages?c.pages+' صفحة':'',title!==f.name?'اسم الملف: '+f.name:''].filter(Boolean).join('\n');
    await save({_id:id,kind:'file',title,fname:f.name,cat:c.cat,type:f.type,size:f.size,pages:c.pages||0,notes,up:false,sorted:true});
    if(w){await save({...w,files:[...new Set([...(w.files||[]),id])]});bump('ملفات في «أعمالي»','work')}
    else if(c.cat==='أبحاث'||c.work||WORK_RE.test(baseName(f.name))){await save({...items.get(id),cat:'من أعمالي'});await save({_id:uid(),kind:'work',title:c.title||baseName(f.name),type:'بحث',status:'منجز',notes:c.author?'المؤلف: '+c.author:'',files:[id]});bump('أعمال جديدة في «أعمالي»','work')}

/* ---------- بطاقات الاتصال vCard ---------- */
function parseVcf(txt){
  const out=[];txt=txt.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'');
  for(const card of txt.split(/BEGIN:VCARD/i).slice(1)){
    const c={};for(const line of card.split(/\r?\n/)){
      const m=line.match(/^([^:;]+)[^:]*:(.*)$/);if(!m)continue;const k=m[1].toUpperCase().replace(/^ITEM\d+\./,'');let v=m[2].replace(/\\,/g,',').replace(/\\n/gi,' ');
      if(/QUOTED-PRINTABLE/i.test(line)){try{v=decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(_){}}
      if(k==='FN'&&!c.title)c.title=v;else if(k==='N'&&!c.title)c.title=v.split(';').filter(Boolean).reverse().join(' ');
      else if(k==='TEL'&&!c.phone)c.phone=v;else if(k==='EMAIL'&&!c.email)c.email=v;else if(k==='ORG'&&!c.role)c.role=v.replace(/;/g,' ');
      else if(k==='TITLE')c.role=(c.role?c.role+' · ':'')+v;else if(k==='NOTE')c.notes=v;
    }
    if(c.title||c.phone)out.push(c);
  }
  return out;
}
async function importVcf(files,quiet){
  let n=0;for(const f of files){for(const c of parseVcf(await f.text())){await save(Object.assign({_id:uid(),kind:'contact',group:'أخرى',title:c.title||c.phone},c));n++}}
  if(quiet)return n;render();toast(n?'أُضيفت '+n+' جهة اتصال':'لم أجد جهات اتصال في الملف');
}

const NATIVE=!!(window.KHIZANA_NATIVE&&window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.khizanaFile);
/* ====== تنظيف جهات الاتصال المكررة في الآيفون ======
   الصفحة تقرأ الجهات وتجمع المكرر، والمستخدم يراجع ويختار، ثم يدمج التطبيق كل مجموعة في جهة واحدة
   (فلا يضيع رقم ولا بريد) ويحذف الباقي. قبل أي حذف تُحفظ نسخة كاملة في «ملفاتي». */
const DD={groups:[],total:0};
const ddName=s=>(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
  .toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').split(' ').filter(Boolean).sort().join(' ');
const ddPhone=p=>{const d=(p||'').replace(/\D/g,'');return d.length>=6?d.slice(-9):''};
function ddFind(list){
  const par=list.map((_,i)=>i),root=i=>par[i]===i?i:(par[i]=root(par[i]));
  const seen=new Map(),link=(k,i)=>{if(!seen.has(k)){seen.set(k,i);return}const a=root(seen.get(k)),b=root(i);if(a!==b)par[b]=a};
  list.forEach((c,i)=>{
    c.nk=ddName(c.name||c.org);c.pk=[...new Set((c.phones||[]).map(ddPhone).filter(Boolean))];c.ek=[...new Set((c.emails||[]).map(e=>e.trim().toLowerCase()).filter(Boolean))];
    c.score=c.pk.length*3+c.ek.length*2+(c.extra||0)+(c.photo?2:0)+(c.name?1:0)+(c.org?1:0);
    if(c.nk)link('n:'+c.nk,i);c.pk.forEach(p=>link('p:'+p,i));c.ek.forEach(e=>link('e:'+e,i));
  });
  const by=new Map();list.forEach((c,i)=>{const r=root(i);by.has(r)?by.get(r).push(c):by.set(r,[c])});
  const out=[];
  for(const m of by.values()){if(m.length<2)continue;
    const same=m.every(c=>c.nk&&c.nk===m[0].nk);
    const sig=c=>c.pk.slice().sort().join()+'|'+c.ek.slice().sort().join();
    const keys=m.flatMap(c=>[...c.pk.map(p=>'p'+p),...c.ek.map(e=>'e'+e)]);
    const shared=keys.length!==new Set(keys).size;
    /* أسماء متوافقة: متطابقة، أو أحدها فارغ، أو أحدها جزء من الآخر («خالد» و«خالد قدوم») */
    const fit=(a,b)=>{if(!a.nk||!b.nk)return true;const x=a.nk.split(' '),y=b.nk.split(' '),[s1,l1]=x.length<=y.length?[x,y]:[y,x];return s1.every(t=>l1.includes(t))};
    const agree=m.every((a,i)=>m.every((b,j)=>j<=i||fit(a,b)));
    const type=same&&m.every(c=>sig(c)===sig(m[0]))?'exact':shared?(agree?'phone':'phoneName'):'name';
    m.sort((a,b)=>b.score-a.score);
    out.push({type,members:m,keep:m[0].id,on:type==='exact'||type==='phone'});
  }
  const rank={exact:0,phone:1,phoneName:2,name:3};
  return out.sort((a,b)=>rank[a.type]-rank[b.type]||(a.members[0].name||'').localeCompare(b.members[0].name||'','ar'));
}
const DD_TYPE={exact:'مكررة تمامًا',phone:'الرقم نفسه',phoneName:'الرقم نفسه بأسماء مختلفة — تأكد أنه الشخص نفسه',name:'الاسم نفسه بأرقام مختلفة — تأكد أنه الشخص نفسه'};

  ${r.failed?`<p>تعذّر دمج ${r.failed} مجموعة فبقيت كما هي (قد تكون من حساب لا يسمح بالتعديل).</p>`:''}
  <p>النسخة الكاملة قبل التنظيف محفوظة في «ملفاتي» باسم «نسخة جهات الاتصال قبل التنظيف».</p></div>
  <div class="actions"><button class="btn primary" data-dd="again">افحص من جديد</button><button class="btn" data-act="close">إغلاق</button></div>`);
  $('#ov').addEventListener('click',e=>{if(e.target.closest('[data-dd="again"]'))ddScan()});
  render();
}

  if(r.status==='denied'){sheet(`<h3>تنظيف جهات الاتصال</h3><div class="box"><p>لم تسمح لـ«خزانتي» بالوصول إلى جهات الاتصال. فعّله من: الإعدادات ← خزانتي ← جهات الاتصال ← الوصول الكامل.</p></div><div class="actions"><button class="btn primary" data-dd="settings">افتح الإعدادات</button><button class="btn" data-act="close">إغلاق</button></div>`);
    $('#ov').addEventListener('click',e=>{if(e.target.closest('[data-dd="settings"]'))nat({action:'openSettings'})});return}
  DD.total=r.list.length;DD.groups=ddFind(r.list);ddView();
  if(r.status==='limited')toast('سمحت ببعض الجهات فقط؛ للفحص الكامل: الإعدادات ← خزانتي ← جهات الاتصال ← الوصول الكامل');
}

const nat=m=>webkit.messageHandlers.khizanaFile.postMessage(m);
const MIME={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',gif:'image/gif',webp:'image/webp',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg',mp4:'video/mp4',mov:'video/quicktime',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',txt:'text/plain',zip:'application/zip'};
let polling=false;
let pollAgain=false;
window.khizanaPoll=async function(){
  if(!NATIVE)return;if(polling){pollAgain=true;return}polling=true;pollAgain=false;
  try{const list=await nat({action:'pending'})||[];const got=[],ans=[],ids=[];
    for(const f of list){const parts=[];for(let i=0;;i++){const s=await nat({action:'read',id:f.id,i});if(!s)break;parts.push(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
      const ext=(f.name.split('.').pop()||'').toLowerCase();got.push(new File(parts,f.name,{type:MIME[ext]||''}));
      let an=null;if(NEEDS_READ.includes(ext))try{an=await nat({action:'analyze',id:f.id,src:'inbox',name:f.name})}catch(_){}ans.push(an);ids.push(f.id)}
    if(got.length){tab='file';filter='';q='';$('#q').value='';closeSheet();await addFiles(got,ans)}
    for(const id of ids)await nat({action:'done',id}); /* لا تُحذف نسخة التطبيق إلا بعد الحفظ، فلا يضيع ملف */
  }catch(_){}
  polling=false;
  if(pollAgain)setTimeout(khizanaPoll,300);
};
/* كلما عاد التطبيق إلى الواجهة نسأل عن الملفات والجهات الواردة، فلا يضيع ما أُرسل والصفحة مشغولة */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>window.khizanaPoll&&khizanaPoll(),400)});
window.addEventListener('focus',()=>setTimeout(()=>window.khizanaPoll&&khizanaPoll(),400));
async function nativeShow(it,b){
  toast('جارٍ فتح الملف…');const step=393216;
  for(let i=0,o=0;o<b.size||i===0;i++,o+=step){const s=await b64(b.slice(o,o+step));if(!await nat({action:'chunk',id:it._id,i,s}))return toast('تعذّر فتح الملف')}
  await nat({action:'show',id:it._id,name:it.fname||it.title});
}

      document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{});
    /* إذا نزلت نسخة جديدة يظهر شريط أخضر كتطبيق المدرسة، ولا يُعاد التحميل وحده (فلا يُقطع ما تكتبه) */
    if(navigator.serviceWorker.controller)navigator.serviceWorker.addEventListener('controllerchange',()=>{if(document.getElementById('updBar'))return;
      const b=document.createElement('button');b.id='updBar';b.type='button';b.textContent='🔄 نسخة جديدة من خزانتي جاهزة — اضغط هنا للتحديث';
      b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:99999;padding:14px;border:0;border-radius:14px;background:#0e5a4f;color:#fff;font:inherit;font-weight:700;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.35)';
      b.onclick=()=>location.reload();document.body.appendChild(b)});
  }
  if(NATIVE)khizanaPoll();
  setTimeout(()=>rescueBooks().catch(()=>{}).then(()=>sortWorks()).then(()=>items.get('_tidy1')?0:tidyAll()).catch(()=>{}),3000);
})();
