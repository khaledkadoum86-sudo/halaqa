/* خزانة: ختم في الرأس، بحث، بطاقات لكل درج، وأدراج في الأسفل */
:root{
  --bg:#f3f4f6; --paper:#ffffff; --ink:#1c2836; --muted:#5d6877; --line:#dde1e7;
  --gold:#9c7726; --gold-soft:#f3ead6; --ink-btn:#1f3348; --on-btn:#ffffff; --danger:#a3392f;
  --ok:#2f6b4a; --ok-soft:#e2efe7; --warn:#8a5a12; --warn-soft:#f6ead4; --plan:#455a75; --plan-soft:#e4e9f1;
  --f-display:"Amiri","Noto Naskh Arabic",serif;
  --f-body:"Noto Naskh Arabic","Amiri",-apple-system,"Segoe UI",Tahoma,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --paper:#17212d; --ink:#e7e9ec; --muted:#9aa5b3; --line:#2a3644;
  --gold:#d2ab5a; --gold-soft:#2c2617; --ink-btn:#d2ab5a; --on-btn:#16202c; --danger:#e07b70;
  --ok:#7cc59b; --ok-soft:#1b2d24; --warn:#e2b36a; --warn-soft:#2f2617; --plan:#9fb4d1; --plan-soft:#1e2938; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --paper:#17212d; --ink:#e7e9ec; --muted:#9aa5b3; --line:#2a3644;
  --gold:#d2ab5a; --gold-soft:#2c2617; --ink-btn:#d2ab5a; --on-btn:#16202c; --danger:#e07b70;
  --ok:#7cc59b; --ok-soft:#1b2d24; --warn:#e2b36a; --warn-soft:#2f2617; --plan:#9fb4d1; --plan-soft:#1e2938; color-scheme:dark}
:root[data-font="amiri"]{--f-body:"Amiri","Noto Naskh Arabic",serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs,16px);line-height:1.7;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px}
header.top{display:flex;align-items:center;gap:14px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.seal{width:62px;height:62px;flex:none}
.who{min-width:0;flex:1}
.gear{flex:none;align-self:flex-start;width:42px;height:42px;border:1px solid var(--line);background:var(--paper);border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.gear svg{width:22px;height:22px}
.gear[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.who h1{font-family:var(--f-display);font-size:1.7rem;line-height:1.2;margin:0;font-weight:700}
.who p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.status{font-size:.78rem;color:var(--muted);margin-top:2px}
.status.warn{color:var(--warn)} .status.ok{color:var(--ok)}
.search{width:100%;margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
h2.sec{font-family:var(--f-display);font-size:1.5rem;margin:22px 0 4px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink-btn);color:var(--on-btn);border-color:var(--ink-btn)}
.list{display:grid;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.card .head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{margin:0;font-family:var(--f-display);font-size:1.2rem;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.notes{font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.pill{flex:none;font-size:.76rem;padding:1px 10px;border-radius:999px;background:var(--plan-soft);color:var(--plan);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 12px;font-size:.9rem;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.fab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--ink-btn);color:var(--on-btn);border-color:var(--ink-btn)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.box{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:14px;display:grid;gap:8px;margin-bottom:12px}
.box p{margin:0}
.drop{display:grid;gap:2px;text-align:center;border:2px dashed var(--gold);background:var(--gold-soft);border-radius:12px;padding:18px;cursor:pointer;margin-bottom:12px}
.drop span{font-size:.85rem;color:var(--muted)}
.thumb{max-width:100%;max-height:200px;border-radius:8px;object-fit:contain;justify-self:start}
.prof{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.prof dl{margin:0}
.prof .row{display:grid;grid-template-columns:8.5em 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prof .row:last-child{border-bottom:0}
.prof dt{color:var(--muted);font-size:.9rem}
.prof dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:8px;margin:14px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.panel p{margin:0}
nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tab{flex:1;min-width:0;max-width:140px;border:0;background:none;padding:8px 1px 9px;cursor:pointer;font-size:.76rem;color:var(--muted);display:grid;justify-items:center;gap:1px;border-top:2px solid transparent}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--gold);border-top-color:var(--gold);font-weight:600}
.fab{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink-btn);color:var(--on-btn);border:0;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgb(0 0 0 / .22);z-index:6}
.overlay{position:fixed;inset:0;background:rgb(10 16 24 / .5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--f-display);font-size:1.4rem;margin:0 0 10px;overflow-wrap:anywhere}
.field{display:grid;gap:3px;margin-bottom:10px}
.field label{font-size:.88rem;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.field textarea{min-height:90px;resize:vertical}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.foot .spacer{flex:1}
.viewer img,.viewer video{max-width:100%;max-height:60vh;display:block;margin:0 auto 10px;border-radius:8px}
.viewer iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff}
.viewer audio{width:100%;margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:999px;font-size:.88rem;z-index:30;max-width:90%;text-align:center}
.sgroup{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:2px 16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .lbl{min-width:0}
.srow .lbl b{display:block;font-weight:600}
.srow .lbl span{display:block;color:var(--muted);font-size:.84rem;line-height:1.5}
.srow select{flex:none;max-width:48%;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.sw{flex:none;position:relative;width:50px;height:30px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .15s}
.sw input:checked+i{background:var(--gold)}
.sw input:checked+i::after{transform:translateX(-20px)}
.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.sw input:disabled+i{opacity:.45}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.lock .seal{width:96px;height:96px}
.lock h2{font-family:var(--f-display);font-size:1.6rem;margin:0}
.lock .msg{color:var(--muted);font-size:.92rem;min-height:1.6em;text-align:center}
.lock .msg.bad{color:var(--danger)}
.dots{display:flex;gap:14px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:1.6px solid var(--gold)}
.dots i.on{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr;margin-top:6px}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.6rem;font-family:var(--f-body);cursor:pointer;color:var(--ink);display:grid;place-items:center}
.pad button:active{background:var(--gold-soft)}
.pad button.ghost{border:0;background:none;font-size:.95rem;color:var(--muted)}
.pad svg{width:30px;height:30px}
.lock .link{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem}
body.locked .wrap,body.locked nav.tabs,body.locked .fab{visibility:hidden}
@media (max-width:460px){.stats{gap:5px}.stat span{font-size:.72rem}.prof .row{grid-template-columns:1fr;gap:0}}
@media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px)}}}
</style>
</head>

function extOf(n){return (String(n).split('.').pop()||'').toLowerCase()}
function baseName(n){return String(n).replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim()||n}
async function pdfPages(f){
  try{const head=await f.slice(0,Math.min(f.size,4*1048576)).text();
    const m=head.match(/\/Type\s*\/Pages[^>]*?\/Count\s+(\d+)/)||head.match(/\/Count\s+(\d+)[^>]*?\/Type\s*\/Pages/);
    if(m)return +m[1];return (head.match(/\/Type\s*\/Page[^s]/g)||[]).length}catch(_){return 0}
}
function score(set,txt){let s=0;for(const [rx,w] of RULES[set]){const m=txt.match(new RegExp(rx.source,rx.flags.replace('g','')+'g'));if(m)s+=w*Math.min(m.length,3)}return s}
function subjectOf(txt){let best=null,bn=0;for(const [name,rx] of SUBJECTS){const n=(txt.match(new RegExp(rx.source,'g'))||[]).length;if(n>bn){bn=n;best=name}}return best||'أخرى'}
function cleanLine(l){return l.replace(/[ـ]/g,'').replace(/\s+/g,' ').trim()}
function guessTitle(a,n){
  if(a&&a.title&&a.title.length>3&&!/^(untitled|microsoft|document|doc\d|scan|img)/i.test(a.title))return cleanLine(a.title);
  const lines=(a&&a.text||'').split('\n').map(cleanLine).filter(l=>l.length>=4&&l.length<=80&&!/^\d+$/.test(l)&&!/بسم الله|الجمهورية|وزارة|جامعة|كلية|حقوق|الطبعة|ISBN|R[ée]publique|Minist|Universit|D[ée]mocratique/i.test(l));
  return lines[0]||baseName(n);
}
function guessAuthor(a){
  if(a&&a.author&&a.author.length>2&&!/microsoft|adobe|user|admin/i.test(a.author))return cleanLine(a.author);
  const m=(a&&a.text||'').match(/(?:تأليف|لمؤلفه|للإمام|للشيخ|للعلامة|بقلم|إعداد)\s*[:：]?\s*([^\n]{3,60})/);return m?cleanLine(m[1]):'';
}
async function classify(f,a){
  const n=f.name||'',e=extOf(n),t=f.type||'';a=a||{};
  if(e==='vcf'||/vcard/.test(t))return{to:'contact'};
  if(e==='json'&&f.size<50*1048576){try{const o=JSON.parse(await f.text());if(o&&o.app==='khizana')return{to:'backup'}}catch(_){}}
  if((e==='txt'||e==='md'||t==='text/plain')&&f.size<300000)return{to:'note'};
  if(/^audio\//.test(t)||['mp3','m4a','aac','wav','ogg','opus','amr','caf'].includes(e))return{cat:'صوتيات'};
  if(/^video\//.test(t)||['mp4','mov','m4v','3gp','avi','mkv'].includes(e))return{cat:'فيديو'};
  if(['xls','xlsx','csv','numbers','ods'].includes(e))return{cat:'جداول'};
  const isImg=/^image\//.test(t)||['jpg','jpeg','png','heic','heif','gif','webp','tif','tiff'].includes(e);
  const isPdf=e==='pdf'||/pdf/.test(t);
  const pages=a.pages||(isPdf?await pdfPages(f):0);
  const txt=n+'\n'+(a.title||'')+'\n'+(a.author||'')+'\n'+(a.text||'');
  const sc={official:score('official',txt),research:score('research',txt),book:score('book',txt)};
  if(isPdf){if(pages>=60)sc.book+=8;else if(pages>=25)sc.book+=4,sc.research+=3;else if(pages<=4)sc.official+=2;if(a.author)sc.book+=2}
  if(isImg){const words=(a.text||'').split(/\s+/).filter(Boolean).length;
    if(words<12&&sc.official<6)return{cat:/^(IMG|DSC|PXL|photo|صورة)/i.test(n)||!a.ocr?'صور':'صور'};
    sc.official+=words>25?2:0;}
  const best=Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0],top=sc[best];
  if(top<4){if(isImg)return{cat:'صور',pages};return{cat:'مستندات',pages}}
  if(best==='official')return{cat:'وثائق رسمية',pages,title:guessTitle(a,n)};
  if(best==='research')return{cat:'أبحاث',pages,title:guessTitle(a,n),work:pages>=15,author:guessAuthor(a)};
  if(isImg)return{cat:'مستندات',pages};
  return{cat:'كتب PDF',book:true,pages,title:guessTitle(a,n),author:guessAuthor(a),subject:subjectOf(txt)};
}

const IDB={
  db:null,
  open(){return this.db||(this.db=new Promise((ok,no)=>{const r=indexedDB.open('khizana',1);r.onupgradeneeded=()=>{r.result.createObjectStore('recs',{keyPath:'_id'});r.result.createObjectStore('blobs')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},
  async tx(store,mode,fn){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction(store,mode);const st=t.objectStore(store);let res;const q=fn(st);if(q)q.onsuccess=()=>res=q.result;t.oncomplete=()=>ok(res);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})},
  all(){return this.tx('recs','readonly',s=>s.getAll())},
  putRec(r){return this.tx('recs','readwrite',s=>s.put(r))},
  getBlob(id){return this.tx('blobs','readonly',s=>s.get(id))},
  putBlob(id,b){return this.tx('blobs','readwrite',s=>s.put(b,id))},
  delBlob(id){return this.tx('blobs','readwrite',s=>s.delete(id))}
};

/* ---------- المزامنة بين الأجهزة (Firebase، حساب تطبيق المدرسة نفسه) ---------- */
const SYNC={
  auth:null,db:null,user:null,unsub:null,remoteAt:{},started:false,err:'',
  async libs(){
    const add=n=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}-compat.js`;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    if(!window.firebase)await add('app');if(!firebase.auth)await add('auth');if(!firebase.firestore)await add('firestore');
  },
  async start(){
    if(this.started)return;this.started=true;
    try{await this.libs()}catch(_){this.started=false;this.err='لا يوجد اتصال بالإنترنت، ستبدأ المزامنة عند عودته.';status();return}
    if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
    this.auth=firebase.auth();this.db=firebase.firestore();
    this.auth.onAuthStateChanged(u=>this.onUser(u));
  },
  col(n){return this.db.collection('users').doc(this.user.uid).collection(n)},
  onUser(u){
    if(this.unsub){this.unsub();this.unsub=null}
    this.user=u;this.remoteAt={};status();render();
    if(!u)return;
    let first=true;
    this.unsub=this.col('khizana').onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{
        if(ch.type==='removed')return;
        const r=Object.assign({_id:ch.doc.id},ch.doc.data());this.remoteAt[r._id]=r.at||0;
        const l=items.get(r._id);
        if(!l||(r.at||0)>(l.at||0)){save(r,true);if(r.del&&r.kind==='file')IDB.delBlob(r._id).catch(()=>{})}
      });
      if(first){first=false;this.pushAll()}
      this.err='';status();render();
    },e=>{this.err='تعذّر الاتصال بالحساب: '+(e.code||e.message||'');status()});
  },
  clean(r){const o={};for(const k in r)if(k!=='_id'&&r[k]!==undefined)o[k]=r[k];return o},
  async push(r){
    if(!this.user)return;
    try{await this.col('khizana').doc(r._id).set(this.clean(r));this.remoteAt[r._id]=r.at}catch(e){this.err='لم تُرفع بعض التعديلات، ستُرفع لاحقًا';status()}
    if(r.kind==='file'&&!r.del&&!r.up&&r.size<=SYNC_MAX)this.upBlob(r);
  },
  async pushAll(){
    for(const r of items.values()){
      if((r.at||0)>(this.remoteAt[r._id]||0))await this.push(r);
      else if(r.kind==='file'&&!r.del&&!r.up&&r.size<=SYNC_MAX)this.upBlob(r);
    }
  },
  uploading:new Set(),
  async upBlob(r){
    if(!this.user||this.uploading.has(r._id))return;
    const b=await IDB.getBlob(r._id).catch(()=>null);if(!b)return;
    this.uploading.add(r._id);
    try{
      const u=new Uint8Array(await b.arrayBuffer());const n=Math.max(1,Math.ceil(u.length/CHUNK));
      for(let i=0;i<n;i++)await this.col('khizana_blobs').doc(r._id+'_'+i).set({i,n,b:firebase.firestore.Blob.fromUint8Array(u.subarray(i*CHUNK,(i+1)*CHUNK))});
      const cur=items.get(r._id);if(cur&&!cur.del){cur.up=true;cur.parts=n;await save(cur)}
    }catch(e){toast('لم يُرفع «'+r.title+'» إلى الحساب بعد')}
    this.uploading.delete(r._id);
  },
  async downBlob(r){
    if(!this.user||!r.up)return null;
    const parts=[];for(let i=0;i<(r.parts||1);i++){const d=await this.col('khizana_blobs').doc(r._id+'_'+i).get();if(!d.exists)return null;parts.push(d.data().b.toUint8Array())}
    const b=new Blob(parts,{type:r.type||''});await IDB.putBlob(r._id,b);return b;
  },
  async delBlob(r){if(!this.user||!r.up)return;try{for(let i=0;i<(r.parts||1);i++)await this.col('khizana_blobs').doc(r._id+'_'+i).delete()}catch(_){}}
};

    return `<div class="field"><label for="f_${k}">${l}</label>${ctl}</div>`;
  }).join('');
  sheet(`<form id="frm"><h3>${it._id?'تعديل':'إضافة'} ${K.one}</h3>${fields}
   <div class="foot"><button class="btn primary" type="submit">حفظ</button><button class="btn" type="button" data-act="close">إلغاء</button><span class="spacer"></span>${it._id?`<button class="btn danger" type="button" data-act="askDel">حذف</button>`:''}</div><div id="confirm"></div></form>`);
  $('#frm').addEventListener('submit',e=>{e.preventDefault();
    const obj=Object.assign({},it,{kind,_id:it._id||uid()});new FormData(e.target).forEach((v,k)=>obj[k]=String(v).trim());
    if(!obj.title)return;put(obj);closeSheet();toast('حُفظ')});
  $('#frm').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;
    if(a.dataset.act==='askDel')$('#confirm').innerHTML=`<div class="box" style="margin-top:10px"><p>حذف «${esc(it.title)}» نهائيًا من كل أجهزتك؟</p><div class="actions"><button class="btn danger" type="button" data-act="doDel">نعم، احذف</button><button class="btn" type="button" data-act="noDel">تراجع</button></div></div>`;
    if(a.dataset.act==='noDel')$('#confirm').innerHTML='';
    if(a.dataset.act==='doDel'){del(it._id);closeSheet();toast('حُذف')}
  });
}
function openProfile(){
  const p=profile();
  sheet(`<form id="frm"><h3>تعديل الملف الشخصي</h3>${PROFILE_FIELDS.map(([k,l])=>`<div class="field"><label for="p_${k}">${l}</label>${['study','ijazat','bio','interests'].includes(k)?`<textarea id="p_${k}" name="${k}">${esc(p[k]||'')}</textarea>`:`<input id="p_${k}" name="${k}" value="${esc(p[k]||'')}" ${k==='phone'||k==='email'?'dir="ltr"':''}>`}</div>`).join('')}
  <div class="foot"><button class="btn primary" type="submit">حفظ</button><button class="btn" type="button" data-act="close">إلغاء</button></div></form>`);
  $('#frm').addEventListener('submit',e=>{e.preventDefault();const o={_id:'profile',kind:'profile'};new FormData(e.target).forEach((v,k)=>o[k]=String(v).trim());put(o);closeSheet();toast('حُفظ الملف')});
}
let viewerURL=null;
function sheet(html){$('#layer').innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov'||(e.target.dataset&&e.target.dataset.act==='close'))closeSheet()})}
function closeSheet(){$('#layer').innerHTML='';if(viewerURL){URL.revokeObjectURL(viewerURL);viewerURL=null}}
let tt;function toast(m){clearTimeout(tt);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;tt=setTimeout(()=>t.remove(),2200)}

/* ---------- الملفات ---------- */
const NEEDS_READ=['pdf','jpg','jpeg','png','heic','heif','tif','tiff','webp'];
async function analyzeNative(f){
  if(!NATIVE||f.size>40*1048576||!NEEDS_READ.includes(extOf(f.name)))return null;
  try{const tmp='a'+uid();const step=393216;
    for(let i=0,o=0;o<f.size||i===0;i++,o+=step){if(!await nat({action:'chunk',id:tmp,i,s:await b64(f.slice(o,o+step))}))return null}
    return await nat({action:'analyze',id:tmp,src:'part',name:f.name})}catch(_){return null}
}
async function addFiles(list,analyses){
  const tally={};const bump=(k,tb)=>{tally[k]=tally[k]||{n:0,tab:tb};tally[k].n++};
  if(list.length>1||NATIVE)toast('جارٍ قراءة '+(list.length>1?list.length+' ملفات':'الملف')+' وتصنيفه…');
  for(let i=0;i<list.length;i++){
    const f=list[i];
    const a=S.smart?((analyses&&analyses[i])||await analyzeNative(f)):null;
    const c=await classify(f,a);
    if(c.book&&!S.autoBook)c.book=false;
    if(c.to==='contact'){await importVcf([f],true);bump('جهات اتصال','contact');continue}
    if(c.to==='backup'){await doImport(f);bump('نسخة احتياطية استُعيدت','profile');continue}
    if(c.to==='note'){await save({_id:uid(),kind:'note',tag:'فائدة علمية',title:baseName(f.name),body:await f.text()});bump('مذكرات','note');continue}
    const id=uid();
    try{await IDB.putBlob(id,f)}catch(e){toast('لا توجد مساحة كافية لـ«'+f.name+'»');continue}
    const title=c.title&&c.title!==baseName(f.name)?c.title:f.name;
    const notes=[c.author?'المؤلف: '+c.author:'',c.pages?c.pages+' صفحة':'',title!==f.name?'اسم الملف: '+f.name:''].filter(Boolean).join('\n');
    await save({_id:id,kind:'file',title,fname:f.name,cat:c.cat,type:f.type,size:f.size,pages:c.pages||0,notes,up:false});
    if(c.book){await save({_id:uid(),kind:'book',title:c.title||baseName(f.name),author:c.author||'',cat:c.subject||'أخرى',status:'أملكه',place:'نسخة PDF في «ملفاتي»'+(c.pages?' · '+c.pages+' صفحة':''),fileId:id});bump('كتب في «كتبي»','book')}
    else bump(c.cat,'file');
  }
  const keys=Object.keys(tally);if(!keys.length){render();return}
  const top=keys.sort((x,y)=>tally[y].n-tally[x].n)[0];
  tab=tally[top].tab;filter=tab==='file'&&keys.length===1?top:'';q='';$('#q').value='';render();
  toast('وصل: '+keys.map(k=>tally[k].n+' '+k).join('، '));
}
async function getFile(it){
  let b=await IDB.getBlob(it._id).catch(()=>null);
  if(!b&&it.up){toast('جارٍ جلب الملف من حسابك…');b=await SYNC.downBlob(it).catch(()=>null)}
  if(!b){toast(it.size>SYNC_MAX?'هذا الملف محفوظ في الجهاز الذي أضفته منه فقط':'الملف غير متوفر هنا بعد، ادخل إلى حسابك ثم أعد المحاولة');return null}
  return b;
}
async function openFile(id){
  const it=items.get(id);const b=await getFile(it);if(!b)return;
  if(NATIVE)return nativeShow(it,b);
  viewerURL=URL.createObjectURL(b);const t=it.type||b.type||'';let v;
  if(/^image\//.test(t))v=`<img src="${viewerURL}" alt="">`;
  else if(/pdf/.test(t))v=`<iframe src="${viewerURL}" title="${esc(it.title)}"></iframe>`;
  else if(/^audio\//.test(t))v=`<audio src="${viewerURL}" controls></audio>`;
  else if(/^video\//.test(t))v=`<video src="${viewerURL}" controls playsinline></video>`;
  else v=`<p class="meta">لا يمكن عرض هذا النوع هنا. اضغط «فتح في تطبيق آخر».</p>`;
  const u=viewerURL;
  sheet(`<div class="viewer"><h3>${esc(it.title)}</h3>${v}<div class="foot"><button class="btn primary" data-act="shareOpen">فتح في تطبيق آخر</button><a class="btn" href="${u}" target="_blank" rel="noopener">فتح في صفحة كاملة</a><button class="btn" data-act="close">إغلاق</button></div></div>`);
  viewerURL=u;
  $('#ov [data-act="shareOpen"]').addEventListener('click',()=>shareFile(id));
}
async function shareFile(id){
  const it=items.get(id);const b=await getFile(it);if(!b)return;
  if(NATIVE)return nativeShow(it,b);
  const f=new File([b],it.fname||it.title,{type:it.type||b.type||'application/octet-stream'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(_){}}
  else saveAs(f);
}
function saveAs(f){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

/* ---------- بطاقات الاتصال vCard ---------- */
function parseVcf(txt){
  const out=[];txt=txt.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'');
  for(const card of txt.split(/BEGIN:VCARD/i).slice(1)){
    const c={};for(const line of card.split(/\r?\n/)){
      const m=line.match(/^([^:;]+)[^:]*:(.*)$/);if(!m)continue;const k=m[1].toUpperCase().replace(/^ITEM\d+\./,'');let v=m[2].replace(/\\,/g,',').replace(/\\n/gi,' ');
      if(/QUOTED-PRINTABLE/i.test(line)){try{v=decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(_){}}
      if(k==='FN'&&!c.title)c.title=v;else if(k==='N'&&!c.title)c.title=v.split(';').filter(Boolean).reverse().join(' ');
      else if(k==='TEL'&&!c.phone)c.phone=v;else if(k==='EMAIL'&&!c.email)c.email=v;else if(k==='ORG'&&!c.role)c.role=v.replace(/;/g,' ');
      else if(k==='TITLE')c.role=(c.role?c.role+' · ':'')+v;else if(k==='NOTE')c.notes=v;
    }
    if(c.title||c.phone)out.push(c);
  }
  return out;
}
async function importVcf(files,quiet){
  let n=0;for(const f of files){for(const c of parseVcf(await f.text())){await save(Object.assign({_id:uid(),kind:'contact',group:'أخرى',title:c.title||c.phone},c));n++}}
  if(quiet)return n;render();toast(n?'أُضيفت '+n+' جهة اتصال':'لم أجد جهات اتصال في الملف');
}

/* ---------- النسخ الاحتياطية ---------- */
function b64(blob){return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.readAsDataURL(blob)})}
async function doExport(withFiles){
  const recs=[...items.values()];const out={app:'khizana',ver:APP_VER,date:new Date().toISOString(),recs};
  if(withFiles){toast('جارٍ تجهيز النسخة…');out.files={};for(const r of recs)if(r.kind==='file'&&!r.del){const b=await IDB.getBlob(r._id).catch(()=>null);if(b)out.files[r._id]=await b64(b)}}
  S.lastBackup=Date.now();saveS();
  const f=new File([JSON.stringify(out)],(withFiles?'خزانتي-مع-الملفات':'خزانتي')+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(_){}}else saveAs(f);
}
async function doImport(file){
  try{const o=JSON.parse(await file.text());if(o.app!=='khizana'||!Array.isArray(o.recs))throw 0;let n=0;
    for(const r of o.recs){if(!r||!r._id)continue;const l=items.get(r._id);
      if(o.files&&o.files[r._id]){const bin=Uint8Array.from(atob(o.files[r._id]),c=>c.charCodeAt(0));await IDB.putBlob(r._id,new Blob([bin],{type:r.type||''}))}
      if(!l||(r.at||0)>=(l.at||0)){r.up=r.kind==='file'?false:r.up;await save(r);n++}}
    render();toast('استُعيد '+n+' عنصرًا');
  }catch(_){toast('هذا الملف ليس نسخة من خزانتي')}
}

/* ---------- الأحداث ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-filter],[data-edit],[data-copy],[data-act],[data-open],[data-share]');if(!t||t.closest('#frm')||t.closest('.viewer')||t.closest('#lock'))return;
  if(t.dataset.tab){tab=(t.dataset.tab==='settings'&&tab==='settings')?'profile':t.dataset.tab;filter='';q='';$('#q').value='';render();scrollTo(0,0)}
  else if(t.dataset.filter!==undefined){filter=t.dataset.filter;render()}
  else if(t.dataset.edit){const it=items.get(t.dataset.edit);openForm(it.kind,it)}
  else if(t.dataset.open)openFile(t.dataset.open);
  else if(t.dataset.share)shareFile(t.dataset.share);
  else if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);toast('نُسخ')}catch(_){toast('تعذّر النسخ')}}
  else{const a=t.dataset.act;
    if(a==='seed'){for(const [title,type,status,notes] of MY_WORKS)await save({_id:uid(),kind:'work',title,type,status,notes});await save({_id:'_seeded',kind:'meta'});render();toast('أُضيفت أعمالك')}
    else if(a==='editProfile')openProfile();
    else if(a==='changePin')pinSheet('change');
    else if(a==='lockNow')lock();
    else if(a==='export')doExport(false);
    else if(a==='exportFiles')doExport(true);
    else if(a==='syncNow'){await SYNC.pushAll();toast('تمت المزامنة')}
    else if(a==='signOut'){await SYNC.auth.signOut();toast('خرجت من الحساب، وبقيت البيانات في هذا الجهاز')}
    else if(a==='reset'){const em=$('#em').value.trim();if(!em)return;try{await SYNC.start();await SYNC.auth.sendPasswordResetEmail(em);$('#loginMsg').textContent='أرسلنا رابط تغيير كلمة السر إلى بريدك، وقد يصل إلى «الرسائل غير المرغوب فيها».'}catch(err){$('#loginMsg').textContent='تعذّر الإرسال: '+(err.code||'')}}
  }
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login')return;e.preventDefault();
  const em=$('#em').value.trim(),pw=$('#pw').value,msg=$('#loginMsg');msg.textContent='جارٍ الدخول…';
  try{await SYNC.start();if(!SYNC.auth)throw{code:'offline'};await SYNC.auth.signInWithEmailAndPassword(em,pw);toast('دخلت إلى حسابك')}
  catch(err){msg.textContent=/wrong-password|invalid-credential|invalid-login/.test(err.code||'')?'البريد أو كلمة السر غير صحيحة. استعمل كلمة سر حساب المزامنة في تطبيق المدرسة.':err.code==='offline'?'لا يوجد اتصال بالإنترنت.':'تعذّر الدخول: '+(err.code||err.message||'')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.set){setChange(t);return}
  if(t.id==='up'&&t.files.length){addFiles([...t.files]);t.value=''}
  if(t.id==='vcf'&&t.files.length){importVcf([...t.files]);t.value=''}
  if(t.id==='imp'&&t.files[0]){doImport(t.files[0]);t.value=''}
});
document.addEventListener('dragover',e=>{if(tab==='file')e.preventDefault()});
document.addEventListener('drop',e=>{if(tab==='file'&&e.dataTransfer.files.length){e.preventDefault();addFiles([...e.dataTransfer.files])}});
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData&&e.clipboardData.files||[])];if(fs.length&&!e.target.closest('input,textarea')){tab='file';addFiles(fs)}});
$('#fab').addEventListener('click',()=>openForm(tab));
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('online',()=>{if(!SYNC.started)SYNC.start()});
document.addEventListener('visibilitychange',()=>{
  if(!S.pin||authing||locked)return;
  if(document.hidden){hiddenAt=Date.now();return}
  const after=+S.lockAfter;if(after<0||!hiddenAt)return;
  if(Date.now()-hiddenAt>=after*1000)lock();hiddenAt=0;
});

/* ---------- التطبيق الأصلي: الملفات الواردة من قائمة المشاركة، والعرض بـ Quick Look ---------- */
const NATIVE=!!(window.KHIZANA_NATIVE&&window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.khizanaFile);
const nat=m=>webkit.messageHandlers.khizanaFile.postMessage(m);
const MIME={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',gif:'image/gif',webp:'image/webp',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg',mp4:'video/mp4',mov:'video/quicktime',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',txt:'text/plain',zip:'application/zip'};
let polling=false;
window.khizanaPoll=async function(){
  if(!NATIVE||polling)return;polling=true;
  try{const list=await nat({action:'pending'})||[];const got=[],ans=[];
    for(const f of list){const parts=[];for(let i=0;;i++){const s=await nat({action:'read',id:f.id,i});if(!s)break;parts.push(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
      const ext=(f.name.split('.').pop()||'').toLowerCase();got.push(new File(parts,f.name,{type:MIME[ext]||''}));
      let an=null;if(NEEDS_READ.includes(ext))try{an=await nat({action:'analyze',id:f.id,src:'inbox',name:f.name})}catch(_){}ans.push(an);await nat({action:'done',id:f.id})}
    if(got.length){tab='file';filter='';q='';$('#q').value='';closeSheet();await addFiles(got,ans)}
  }catch(_){}
  polling=false;
};
async function nativeShow(it,b){
  toast('جارٍ فتح الملف…');const step=393216;
  for(let i=0,o=0;o<b.size||i===0;i++,o+=step){const s=await b64(b.slice(o,o+step));if(!await nat({action:'chunk',id:it._id,i,s}))return toast('تعذّر فتح الملف')}
  await nat({action:'show',id:it._id,name:it.fname||it.title});
}

(async function boot(){
  if(S.pin){document.body.classList.add('locked')}
  if(NATIVE){try{const r=await nat({action:'biometry'});BIO=r||'old'}catch(_){BIO='old'}}
  if(S.pin){document.body.classList.remove('locked');lock()}
  render();
  try{const all=await IDB.all();items=new Map(all.map(r=>[r._id,r]))}catch(e){toast('تعذّر فتح بيانات الجهاز')}
  render();status();
  SYNC.start();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(NATIVE)khizanaPoll();
})();
</script>
