<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e5a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="متابعة الطالب">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>متابعة الطالب — المدرسة القرءانية النموذجية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f3;--surface:#fff;--soft:#eaefe9;--line:#d6ddd5;--ink:#16302b;--muted:#5d6f69;--accent:#0e5a4f;--gold:#b9852a;
  --p:#1f7a4d;--pbg:#dff1e6;--a:#b23b32;--abg:#f8e1de;--j:#a06a12;--jbg:#f7ecd6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1715;--surface:#16211e;--soft:#1d2b27;--line:#2b3c37;--ink:#e4ece9;--muted:#97aaa4;--accent:#3fb39d;--gold:#e0b25a;
  --p:#5fd39a;--pbg:#173a2a;--a:#f0857b;--abg:#3f1f1c;--j:#e7b65a;--jbg:#3a2e17;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--accent)}
header img{width:58px;height:58px;border-radius:14px;object-fit:cover;border:1px solid var(--line)}
header b{display:block;font-family:"Reem Kufi",sans-serif;font-size:1.25rem;color:var(--accent);line-height:1.3}
header span{font-size:.85rem;color:var(--muted)}
.who{margin:18px 0 6px}
.who small{color:var(--muted)}
.who h1{margin:2px 0;font-size:1.6rem;line-height:1.3}
.upd{font-size:.82rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.card h2{margin:0 0 10px;font-size:1rem;color:var(--accent)}
.hz{display:flex;align-items:center;gap:14px}
.hz .n{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;flex:none}
.hz b{font-size:1.15rem}.hz em{display:block;font-style:normal;color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border-radius:12px;padding:10px 6px;text-align:center}
.st b{display:block;font-size:1.5rem;line-height:1.2}.st span{font-size:.8rem}
.st.p{background:var(--pbg);color:var(--p)}.st.a{background:var(--abg);color:var(--a)}.st.j{background:var(--jbg);color:var(--j)}
.rate{margin-top:10px;font-size:.92rem;color:var(--muted)}
.dates{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.dates span{background:var(--abg);color:var(--a);border-radius:999px;padding:2px 10px;font-size:.85rem}
.dates.j span{background:var(--jbg);color:var(--j)}
.list{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.row:last-child{border-bottom:0}
.tag{border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:600}
.tag.p{background:var(--pbg);color:var(--p)}.tag.a{background:var(--abg);color:var(--a)}.tag.j{background:var(--jbg);color:var(--j)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}td:first-child,th:first-child{text-align:right}
.msg{margin-top:40px;text-align:center;color:var(--muted);line-height:2}
.foot{margin-top:18px;text-align:center;font-size:.78rem;color:var(--muted)}
.spin{width:36px;height:36px;margin:60px auto 10px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="logo.webp" alt=""><div><b>المدرسة القرءانية النموذجية</b><span>مسجد القطب الأمير عبد القادر — قسنطينة</span></div></header>
  <main id="out"><div class="spin"></div><div class="msg">جارٍ التحميل…</div></main>
</div>
<script>
const PROJECT="halaqa-23193",API_KEY="AIzaSyBK_YYaKosnedg0B-gtb-tshf6j5I1gRCY";
const MON=["جانفي","فيفري","مارس","أفريل","ماي","جوان","جويلية","أوت","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DAYN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const dshort=s=>{const d=pd(s);return d.getDate()+" "+MON[d.getMonth()]};
const dlong=s=>{const d=pd(s);return DAYN[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]};
const mname=k=>{const[y,m]=k.split("-").map(Number);return MON[m-1]+" "+y};
const th=n=>n===1?"ثمن واحد":n===2?"ثمنان":n<=10?n+" أثمان":n+" ثمنًا";
const hzc=c=>c===1?"حزب واحد":c===2?"حزبان":c<=10?c+" أحزاب":c+" حزبًا";
const rate=(p,j,a)=>(p+j+a)?Math.round(100*(p+j/2)/(p+j+a)):null;
const key=(location.hash||"").replace(/^#/,"").replace(/[^A-Za-z0-9]/g,"");
const out=document.getElementById("out");
function fail(t){out.innerHTML=`<div class="msg">${t}</div>`}
async function load(){
  if(!key||key.length<12){fail("الرابط ناقص. افتح الرابط كما وصلك من المعلّم.");return}
  let r;
  try{r=await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/portal/${key}?key=${API_KEY}`,{cache:"no-store"})}
  catch(_){fail("لا يوجد اتصال بالإنترنت. أعد المحاولة بعد قليل.");return}
  if(r.status===404||r.status===403){fail("هذا الرابط غير صالح أو أوقفه المعلّم.<br>اطلب من المعلّم الرابط الجديد.");return}
  if(!r.ok){fail("تعذّر التحميل، أعد المحاولة بعد قليل.");return}
  let d;try{d=JSON.parse((await r.json()).fields.j.stringValue)}catch(_){fail("تعذّر قراءة البيانات.");return}
  paint(d);
}
function paint(d){
  const f=d.sex==="f",T=f?"الطالبة":"الطالب",g=(m,w)=>f?w:m;
  document.title="متابعة "+d.name;
  const cur=d.months&&d.months[0],now=new Date(),nowK=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const thisM=d.months.find(m=>m.m===nowK)||{m:nowK,p:0,a:0,j:0,th:0,abs:[],part:[]};
  let h=`<div class="who"><small>متابعة ${T}</small><h1>${esc(d.name)}</h1>
    <div class="upd">آخر تحديث: ${new Date(d.upd).toLocaleString("ar-DZ",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}${d.teacher?" · المعلّم: "+esc(d.teacher):""}</div>
    ${d.active?"":`<div class="upd" style="color:var(--a)">${T} موقوف${g("","ة")} حاليًا عن الحلقة</div>`}</div>`;
  if(d.hz){const z=d.hz;
    h+=`<section class="card"><h2>موضع الحفظ</h2><div class="hz"><span class="n">${z.khatm?"🏅":z.cur}</span><div><b>${z.khatm?g("خاتم","خاتمة")+" للقرءان الكريم":"يحفظ الآن الحزب "+z.cur}</b>
      <em>${z.khatm?"أتمّ"+g("","ت")+" حفظ القرءان كاملًا":(z.r?"أتمّ"+g("","ت")+" منه "+th(z.r):"في أوّله")+(z.c?" · "+g("حفظ","حفظت")+" "+hzc(z.c)+" من 60":"")}</em></div></div>
      <div class="bar"><i style="width:${(z.t/480*100).toFixed(1)}%"></i></div></section>`}
  const R=rate(thisM.p,thisM.j,thisM.a);
  h+=`<section class="card"><h2>شهر ${mname(thisM.m)}</h2><div class="stats">
    <div class="st p"><b>${thisM.p}</b><span>حضور</span></div><div class="st j"><b>${thisM.j}</b><span>حضور جزئي</span></div><div class="st a"><b>${thisM.a}</b><span>غياب</span></div></div>
    ${R!=null?`<div class="rate">نسبة الحضور: <b>${R}%</b>${thisM.th?" · حفظ هذا الشهر: "+th(thisM.th):""}</div>`:`<div class="rate">لم تُسجَّل حصص هذا الشهر بعد.</div>`}
    ${thisM.abs.length?`<div class="rate">أيام الغياب:</div><div class="dates">${thisM.abs.map(x=>`<span>${dshort(x)}</span>`).join("")}</div>`:""}
    ${thisM.part.length?`<div class="rate">أيام الحضور الجزئي:</div><div class="dates j">${thisM.part.map(x=>`<span>${dshort(x)}</span>`).join("")}</div>`:""}</section>`;
  const y=d.year,YR=rate(y.p,y.j,y.a);
  if(y.p+y.a+y.j)h+=`<section class="card"><h2>منذ بداية السنة الدراسية</h2><div class="stats">
    <div class="st p"><b>${y.p}</b><span>حضور</span></div><div class="st j"><b>${y.j}</b><span>حضور جزئي</span></div><div class="st a"><b>${y.a}</b><span>غياب</span></div></div>
    <div class="rate">نسبة الحضور: <b>${YR}%</b>${y.th?" · مجموع الحفظ: "+th(y.th):""}</div></section>`;
  if(d.recent.length)h+=`<section class="card"><h2>آخر الحصص</h2><div class="list">${d.recent.map(x=>`<div class="row"><span>${dlong(x.d)}</span><span>${x.th?`<span style="color:var(--muted);font-size:.85rem">${th(x.th)}</span> `:""}<span class="tag ${x.s}">${x.s==="p"?g("حاضر","حاضرة"):x.s==="a"?g("غائب","غائبة"):"حضور جزئي"}</span></span></div>`).join("")}</div></section>`;
  if(d.months.length>1)h+=`<section class="card"><h2>الأشهر السابقة</h2><table><thead><tr><th>الشهر</th><th>حضور</th><th>جزئي</th><th>غياب</th><th>النسبة</th></tr></thead><tbody>
    ${d.months.map(m=>`<tr><td>${mname(m.m)}</td><td>${m.p}</td><td>${m.j}</td><td>${m.a}</td><td>${rate(m.p,m.j,m.a)??"—"}%</td></tr>`).join("")}</tbody></table></section>`;
  h+=`<div class="foot">هذه الصفحة خاصة ب${T}. لا تنشروا رابطها.<br>لإضافتها إلى الشاشة الرئيسية: زر المشاركة ← «إضافة إلى الشاشة الرئيسية».</div>`;
  out.innerHTML=h;
}
load();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
window.addEventListener("hashchange",()=>location.reload());
</script>
</body>
</html>
